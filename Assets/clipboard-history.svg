<svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .cs-title {
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-weight: 700;
        fill: #900000;
      }

      .cs-sub {
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: #6b7280;
      }
    </style>
  </defs>

  <!-- Main title -->
  <text
    class="cs-title"
    x="450"
    y="68"
    font-size="44"
    text-anchor="middle"
    textLength="460"
    lengthAdjust="spacingAndGlyphs"
  >

    <tspan opacity="0">C
      <animate attributeName="opacity" from="0" to="1"
        begin="0s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">l
      <animate attributeName="opacity" from="0" to="1"
        begin="0.06s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.06s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">i
      <animate attributeName="opacity" from="0" to="1"
        begin="0.12s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.12s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">p
      <animate attributeName="opacity" from="0" to="1"
        begin="0.18s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.18s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">b
      <animate attributeName="opacity" from="0" to="1"
        begin="0.24s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.24s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">o
      <animate attributeName="opacity" from="0" to="1"
        begin="0.30s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.30s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">a
      <animate attributeName="opacity" from="0" to="1"
        begin="0.36s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.36s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">r
      <animate attributeName="opacity" from="0" to="1"
        begin="0.42s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.42s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">d
      <animate attributeName="opacity" from="0" to="1"
        begin="0.48s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.48s" dur="0.35s" fill="freeze"/>
    </tspan>

    <!-- Space -->
    <tspan> </tspan>

    <tspan opacity="0">H
      <animate attributeName="opacity" from="0" to="1"
        begin="0.60s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.60s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">i
      <animate attributeName="opacity" from="0" to="1"
        begin="0.66s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.66s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">s
      <animate attributeName="opacity" from="0" to="1"
        begin="0.72s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.72s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">t
      <animate attributeName="opacity" from="0" to="1"
        begin="0.78s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.78s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">o
      <animate attributeName="opacity" from="0" to="1"
        begin="0.84s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.84s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">r
      <animate attributeName="opacity" from="0" to="1"
        begin="0.90s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.90s" dur="0.35s" fill="freeze"/>
    </tspan>

    <tspan opacity="0">y
      <animate attributeName="opacity" from="0" to="1"
        begin="0.96s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        from="0,14" to="0,0" begin="0.96s" dur="0.35s" fill="freeze"/>
    </tspan>

  </text>

  <!-- Subtitle -->
  <text
    class="cs-sub"
    x="450"
    y="120"
    font-size="17"
    text-anchor="middle"
    opacity="0"
  >
    A lightweight, native clipboard history manager for Linux -
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="1.40s"
      dur="0.65s"
      fill="freeze"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0,8"
      to="0,0"
      begin="1.40s"
      dur="0.65s"
      fill="freeze"
    />
  </text>

  <text
    class="cs-sub"
    x="450"
    y="145"
    font-size="17"
    text-anchor="middle"
    opacity="0"
  >
    the familiar Windows clipboard experience, reimagined for your desktop.
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="1.53s"
      dur="0.65s"
      fill="freeze"
    />
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0,8"
      to="0,0"
      begin="1.53s"
      dur="0.65s"
      fill="freeze"
    />
  </text>

</svg>
